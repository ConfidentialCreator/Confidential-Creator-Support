[package]
name = "ccsupport"
description = "Public fact of creator support with confidential amounts (Token-2022 confidential transfers)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# `cdylib` goes to the network; `lib` is so that the tests (mollusk) see the same
# account layout code, not a copy.
[lib]
crate-type = ["cdylib", "lib"]
name = "ccsupport"

# The standard Anchor feature set. `custom-heap`, `custom-panic`, `anchor-debug`
# are never enabled but are declared: the `#[program]` macro expands into cfgs on them,
# and an unrecognised cfg is a warning that stops the gate under `-D warnings`.
[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

# The same for `cfg(target_os = "solana")`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dependencies]
# `init-if-needed` — `pledge` creates or extends one and the same PDA.
anchor-lang = { workspace = true, features = ["init-if-needed"] }
# `token_interface` — reading the supporter's and creator's ATAs under Token-2022 in `pledge`.
anchor-spl = { workspace = true, features = ["token_2022", "associated_token"] }
# `pledge` reads the `Instructions` sysvar: anchor-lang 1.2 does not re-export
# `load_instruction_at_checked`.
solana-instructions-sysvar.workspace = true

[dev-dependencies]
mollusk-svm.workspace = true
mollusk-svm-bencher.workspace = true
solana-account.workspace = true
solana-instruction.workspace = true
solana-pubkey.workspace = true
solana-svm-log-collector.workspace = true
base64.workspace = true
serde_json.workspace = true
