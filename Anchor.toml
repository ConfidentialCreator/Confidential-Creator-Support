[toolchain]
anchor_version = "1.2.0"
solana_version = "3.1.10"

[features]
resolution = true
skip-lint = false

[programs.localnet]
ccsupport = "8tX3MJt6vzw9fw7gAeBdEtom5cfXR8BMZn9UCPQJrj6z"

[programs.devnet]
ccsupport = "8tX3MJt6vzw9fw7gAeBdEtom5cfXR8BMZn9UCPQJrj6z"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

# `anchor test` is not used: the program tests are mollusk under `cargo test`.
# The network artifact is built by `scripts/wsl-build.sh build-sbf`, not `anchor build`
# (that one produces SBPFv3, which Agave 3.1.10 does not execute).
[scripts]
test = "cargo test --workspace"
