# Pin of the HOST toolchain: tests, clippy, rustfmt.
#
# It does not describe the BPF build: cargo-build-sbf 3.1.10 carries its own rustc 1.89
# inside platform-tools and switches RUSTUP_TOOLCHAIN itself. If `anchor build`
# ever starts failing on channel incompatibility, the cause is here, not in the code.
[toolchain]
channel = "1.97.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
