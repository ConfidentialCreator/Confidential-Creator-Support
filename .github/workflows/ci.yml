name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust — fmt, clippy, build-sbf, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The version comes from rust-toolchain.toml and is not duplicated here: two
      # sources of truth drift silently, and the drift shows up only at build time.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # The program tests run the REAL .so under mollusk, not a host build of the
      # crate: overflow-checks, frame size and `msg!` behave differently under BPF.
      #
      # `cargo-build-sbf`, not `anchor build`: the IDL is not needed here (the client
      # is generated by Codama on the WSL machine and lives in packages/chain), and anchor-cli
      # compiles from source through avm — ten minutes on every PR.
      #
      # No `--arch`: the artifact for the network is SBPFv0, because Agave 3.1.10 on devnet
      # does not execute v3 bytecode. The same v0 gives the hard 4 KiB frame in
      # `try_accounts` — which is exactly why the tests must run v0, not v3: otherwise CI
      # would be green on a binary that cannot reach the network.
      - name: Solana toolchain
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.10/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      # There is no program key in CI — cargo-build-sbf generates a random one. The
      # bytecode is unaffected (declare_id! is baked into the code), and nothing deploys from here.
      - name: BPF artifact (SBPFv0)
        run: cargo-build-sbf --manifest-path programs/ccsupport/Cargo.toml 2>&1 | tee .build.log

      # The same two checks as in scripts/wsl-build.sh: the ELF header and the
      # frame-overflow line, which the build prints as a warning, not an error.
      - name: Artifact is v0 and the frame fits 4 KiB
        run: |
          so=target/deploy/ccsupport.so
          flags="$(readelf -h "$so" | awk '/Flags:/ {print $2}')"
          if [ "$flags" != "0x0" ]; then
            echo "::error::$so has e_flags=$flags, expected 0x0 (SBPFv0)"
            exit 1
          fi
          echo "$so: $(stat -c %s "$so") bytes, SBPFv0"
          if grep -qE 'overwrites values in the frame|exceeded max offset' .build.log; then
            echo "::error::stack frame overflow in the build"
            grep -E 'overwrites values in the frame|exceeded max offset' .build.log | head -5
            exit 1
          fi

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # Cargo.lock is the pin: on it anchor-lang 1.2 and mollusk 0.15.1 re-export
      # one `solana-address 2.6.1`, so `Pubkey` is one type (2.7.0 breaks wincode).
      # If the build changes the lock, the dependencies moved on their own, and that
      # must surface here, not on devnet. `cargo-build-sbf` uses its own rustc and its own
      # resolver, so this step also catches the case where the BPF build pulls the lock
      # away from the host one.
      - name: Lock unchanged
        run: git diff --exit-code Cargo.lock

  node:
    name: Node — amount-guard, lint, typecheck, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same command as locally before a commit. amount-guard goes first:
      # an amount field in the index or API breaks the product more quietly than any red test.
      - name: Gate
        run: pnpm gate

  secrets:
    name: Secrets and traces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The repository is public. Both checks are cheap and catch what, after a
      # push, can only be fixed by rewriting history.
      - name: No private keys in the index
        run: |
          if git grep -nE 'BEGIN (RSA|OPENSSH|EC|PGP) PRIVATE KEY' -- . ; then
            echo "::error::a private key was found in the repository"
            exit 1
          fi
          echo "no keys found"

      # The program key grants deploying under the same address, the audit key —
      # reading every amount, the mint authority — issuing the token. All three live
      # outside the repository; the program key appears in `target/deploy` only for
      # the duration of a build.
      - name: Keypair files are not tracked
        run: |
          tracked="$(git ls-files -- '*-keypair.json' '*.keypair.json' 'id.json' '.env' '.env.*' | grep -v '^\.env\.example$' || true)"
          if [ -n "$tracked" ]; then
            echo "::error::secrets made it into git:"
            echo "$tracked"
            exit 1
          fi
          echo "keypairs and .env are outside the index"

      # The sweep covers the WHOLE history — hence fetch-depth: 0 above. The `ci`
      # mode differs from the local one in one thing: the personal-data list is not
      # here and cannot be (it lives outside the repository on purpose), so its
      # absence is not a failure. All structural patterns run, together with the
      # self-check: a pattern that silently stopped matching and a clean repository
      # look the same from the outside.
      - name: No build-machine traces in the history
        run: bash scripts/trace-sweep.sh ci
