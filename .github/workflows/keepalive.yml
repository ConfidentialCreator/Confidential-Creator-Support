name: Keep the api awake

# The free Render instance spins down after 15 minutes without traffic, and while it
# sleeps the index does not move. The uptime monitor on /health is what keeps it up:
# GitHub runs a `*/5` schedule 10–17 minutes apart, so this is only a second wake-up.
# GitHub disables schedules after 60 days without a commit — re-enable it under
# Actions if the repository goes quiet.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # A sleeping instance takes about a minute to answer the first request.
      - name: GET /health
        # An explicit `bash` runs with pipefail; the default shell does not, and `cut`
        # then turns a timed-out request into a green run.
        shell: bash
        run: |
          curl --silent --show-error --fail --max-time 120 \
            "${{ vars.VITE_API_URL || 'https://ccsupport-api.onrender.com' }}/health" \
            | cut -c1-60
