name: Pages

# Deploys apps/web to GitHub Pages. The api and the worker are processes with keys
# and a database connection — they are hosted elsewhere, and the web reaches the api
# through VITE_API_URL. Repository settings needed once: Pages → Source: GitHub Actions;
# variables VITE_API_URL, VITE_CCS_MINT, VITE_SOLANA_CLUSTER (and PAGES_BASE_PATH=/ for
# a custom domain); secret VITE_SOLANA_RPC_URL — the Helius key lands in the bundle, so
# restrict it to the Pages domain in the Helius dashboard.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a newer push waits for the running one rather than
# cancelling it: a cancelled deploy leaves Pages half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A project site lives under /<repo>/; a custom domain sets PAGES_BASE_PATH to /.
      - name: Build the web
        run: pnpm --filter @ccsupport/web build
        env:
          BASE_PATH: ${{ vars.PAGES_BASE_PATH || format('/{0}/', github.event.repository.name) }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_CCS_MINT: ${{ vars.VITE_CCS_MINT }}
          VITE_SOLANA_CLUSTER: ${{ vars.VITE_SOLANA_CLUSTER }}
          VITE_SOLANA_RPC_URL: ${{ secrets.VITE_SOLANA_RPC_URL }}

      # Pages has no rewrites: an unknown path is served 404.html, and a copy of the
      # app shell there lets the router take over on a deep link.
      - name: SPA fallback
        run: cp apps/web/dist/index.html apps/web/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
