name: Pages

# Deploys the landing (apps/landing, static, no build) to the root of GitHub Pages and
# apps/web under /app/. The api and the worker are processes with keys and a database
# connection — they are hosted elsewhere, and both pages reach the api through
# VITE_API_URL. Repository settings needed once: Pages → Source: GitHub Actions;
# variables VITE_API_URL, VITE_CCS_MINT, VITE_SOLANA_CLUSTER (and PAGES_BASE_PATH=/app/
# for a custom domain); secret VITE_SOLANA_RPC_URL — the Helius key lands in the bundle,
# so restrict it to the Pages domain in the Helius dashboard.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a newer push waits for the running one rather than
# cancelling it: a cancelled deploy leaves Pages half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A project site lives under /<repo>/ with the app in /<repo>/app/; a custom domain
      # sets PAGES_BASE_PATH to /app/.
      - name: Build the web
        run: pnpm --filter @ccsupport/web build
        env:
          BASE_PATH: ${{ vars.PAGES_BASE_PATH || format('/{0}/app/', github.event.repository.name) }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_CCS_MINT: ${{ vars.VITE_CCS_MINT }}
          VITE_SOLANA_CLUSTER: ${{ vars.VITE_SOLANA_CLUSTER }}
          VITE_SOLANA_RPC_URL: ${{ secrets.VITE_SOLANA_RPC_URL }}

      # Pages has no rewrites and serves a custom 404 only from the site root, so the root
      # 404.html is the app shell: a deep link under /app/ lands there and the router takes
      # over; a v0.1.0 link outside /app/ is moved under it by the app before routing.
      - name: Assemble the site
        run: |
          mkdir -p site
          cp -r apps/landing/. site/
          cp -r apps/web/dist site/app
          cp apps/web/dist/index.html site/404.html
          sed -i 's|<meta name="ccs-api" content="">|<meta name="ccs-api" content="${{ vars.VITE_API_URL }}">|' site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
